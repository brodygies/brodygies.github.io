<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
    <link rel="icon" type="image/x-icon" href="media/images/favicon_io/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="showtime.html">Showtimes</a></li>
                <li><a href="contact.html">Tickets</a></li>
            </ul>
        </nav>
    </header>

    <!-- Customer Information -->
    <h1>Tickets Information</h1>
    <p>$20 Per Ticket</p>

    <form>
        <table>
            <tr>
                <td><label>First Name:</label></td>
                <td><input type="text" placeholder="First Name"></td>
            </tr>
            <tr>
                <td><label>Last Name:</label></td>
                <td><input type="text" placeholder="Last Name"></td>
            </tr>
            <tr>
                <td><label>Email:</label></td>
                <td><input type="email" placeholder="Email"></td>
            </tr>
            <tr>
                <td><label>Card Number:</label></td>
                <td><input type="text" id="cardNumber" placeholder="Card Number"></td>
            </tr>
            <tr>
                <td><label>Quantity:</label></td>
                <td><input type="number" id="quantity" placeholder="Number of Tickets"></td>
            </tr>
        </table>

        <h3>Extras</h3>
        <input type="checkbox" name="extras" value="Popcorn"> Popcorn<br>
        <input type="checkbox" name="extras" value="Drink"> Drink<br>
        <input type="checkbox" name="extras" value="VIP Seating"> VIP Seating<br>

        <!-- Movie Choices -->
        <div id="Movie">
            <h1>Movie</h1>
            <input type="radio" name="Movie" value="Jaws"> Jaws<br>
            <input type="radio" name="Movie" value="Lord of the Rings"> Lord of the Rings<br>
            <input type="radio" name="Movie" value="Star Wars"> Star Wars<br>
            <input type="radio" name="Movie" value="2001 a space odyssey"> 2001 A Space Odyssey<br>
        </div>

        <br>

        <!-- Total Calculator -->
        <button type="button" onclick="calcTotal()">Calculate Total</button>
        <button type="reset" onclick="resetTotal()">Clear</button>

        <p>Total Cost: $<span id="total">0</span></p>
        <p id="cardMessage"></p>
    </form>

    <!-- Footer -->
    <footer>
        <div id="col1">
            <img src="media/images/social.png" alt="Instagram" width="100" height="100">
            <img src="media/images/social-media.png" alt="TikTok" width="100" height="100">
        </div>
        <div id="col2">
            <h3>Business Hours</h3>
            <p>Monday 12pm-11pm</p>
            <p>Wednesday 12pm-11pm</p>
            <p>Friday 12pm-11pm</p>
            <p>Saturday 12pm-11pm</p>
        </div>
    </footer>

    <script src="js/scrpitticket.js"></script>
</body>
</html>
